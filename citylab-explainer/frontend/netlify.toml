# Netlify deployment configuration for Next.js frontend (Vercel alternative, No Docker)
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = "http://127.0.0.1:8000"
